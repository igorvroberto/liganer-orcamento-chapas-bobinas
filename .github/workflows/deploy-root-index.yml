name: Deploy root index to vendas.liganer.com.br

on:
  push:
    branches: [main]
    paths:
      - 'deploy/root-index/**'
      - '.github/workflows/deploy-root-index.yml'
  workflow_dispatch:

concurrency:
  group: deploy-root-index
  cancel-in-progress: true

jobs:
  deploy-root-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare publish folder
        run: |
          mkdir -p root-dist/auth
          cp deploy/root-index/index.html root-dist/index.html
          cp deploy/root-index/login.html root-dist/login.html
          cp deploy/root-index/liganer_favicon.webp root-dist/liganer_favicon.webp
          cp deploy/root-index/auth/*.php root-dist/auth/

      - name: Deploy root index via FTP/FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./root-dist/
          server-dir: /vendas.liganer.com.br/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
