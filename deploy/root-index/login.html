<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/webp" href="/liganer_favicon.webp" />
    <title>Entrar · Liganer Vendas</title>
    <style>
      :root {
        --bg: #f2f2f2;
        --paper: #ffffff;
        --ink: #17211d;
        --muted: #5c5c5c;
        --brand: #c60000;
        --line: #e0e0e0;
        --shadow: 0 16px 40px rgba(20, 37, 31, 0.11);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(198, 0, 0, 0.08), transparent 260px),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        background: var(--paper);
        border: 1px solid rgba(224, 224, 224, 0.9);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 28px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .brand img {
        width: 48px;
        height: 48px;
        border-radius: 10px;
        object-fit: contain;
        background: #fff;
      }
      .brand strong {
        display: block;
        color: var(--brand);
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1.1;
      }
      .brand span {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      .lede {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      label {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 0.84rem;
        font-weight: 700;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        color: var(--ink);
        background: #fff;
      }
      button {
        width: 100%;
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        font: inherit;
        font-weight: 800;
        padding: 12px 14px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.7; cursor: wait; }
      .error {
        min-height: 1.2em;
        margin: 10px 0 0;
        color: var(--brand);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <form class="card" id="login-form">
      <div class="brand">
        <img src="/liganer_favicon.webp" alt="Liganer" width="48" height="48" />
        <div>
          <strong>Liganer</strong>
          <span>Vendas</span>
        </div>
      </div>
      <h1>Entrar</h1>
      <p class="lede">Use seu e-mail Liganer para acessar os sistemas de vendas.</p>
      <label>
        E-mail
        <input id="email" name="email" type="email" autocomplete="username" required />
      </label>
      <label>
        Senha
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" id="submit">Entrar</button>
      <p class="error" id="error" role="alert"></p>
    </form>
    <script>
      const params = new URLSearchParams(location.search)
      const next = params.get('next') || '/'

      async function ensureLoggedOutOrRedirect() {
        try {
          const res = await fetch('/auth/me.php', { credentials: 'same-origin', cache: 'no-store' })
          if (res.ok) location.replace(next)
        } catch (_) {}
      }
      ensureLoggedOutOrRedirect()

      const form = document.getElementById('login-form')
      const errorEl = document.getElementById('error')
      const submit = document.getElementById('submit')

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        errorEl.textContent = ''
        submit.disabled = true
        try {
          const res = await fetch('/auth/login.php', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({
              email: document.getElementById('email').value.trim(),
              password: document.getElementById('password').value,
            }),
          })
          const data = await res.json().catch(() => ({}))
          if (!res.ok || !data.ok) {
            errorEl.textContent = data.error || 'Não foi possível entrar.'
            return
          }
          location.replace(next)
        } catch (_) {
          errorEl.textContent = 'Falha de rede. Tente de novo.'
        } finally {
          submit.disabled = false
        }
      })
    </script>
  </body>
</html>
