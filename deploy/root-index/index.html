<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Liganer Vendas</title>
    <style>
      :root {
        --bg: #f5f7f4;
        --paper: #ffffff;
        --ink: #17211d;
        --muted: #56635d;
        --brand: #c60000;
        --brand-2: #c60000;
        --line: #d8dfd9;
        --shadow: 0 16px 40px rgba(20, 37, 31, 0.11);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(198, 0, 0, 0.08), transparent 260px),
          var(--bg);
      }

      main {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 56px;
      }

      .hero,
      .apps {
        background: var(--paper);
        border: 1px solid rgba(216, 223, 217, 0.9);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 28px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--brand);
        font-size: 0.76rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.9rem, 4vw, 2.7rem);
        line-height: 1.08;
        color: var(--ink);
      }

      .lede {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 1rem;
        max-width: 62ch;
      }

      .apps {
        margin-top: 20px;
        padding: 20px;
      }

      .apps-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .app-link {
        display: block;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(180deg, #fff, #fbfbf7);
        color: inherit;
        text-decoration: none;
        transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      }

      .app-link:hover,
      .app-link:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(198, 0, 0, 0.35);
        box-shadow: 0 14px 28px rgba(20, 37, 31, 0.08);
        outline: none;
      }

      .app-title {
        margin: 0 0 8px;
        color: var(--brand);
        font-size: 1.1rem;
        font-weight: 700;
      }

      .app-desc {
        margin: 0;
        color: var(--muted);
        font-size: 0.96rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <p class="eyebrow">Liganer</p>
        <h1>Sistemas de vendas</h1>
        <p class="lede">
          Acesso rápido aos sistemas atualmente publicados em vendas.liganer.com.br.
        </p>
      </section>

      <section class="apps" aria-label="Links dos sistemas">
        <div class="apps-grid">
          <a class="app-link" href="/orcamento/blanks-slitters/">
            <h2 class="app-title">Blanks e slitters</h2>
            <p class="app-desc">Sistema comercial de blanks.</p>
          </a>

          <a class="app-link" href="/orcamento/chapas-bobinas/">
            <h2 class="app-title">Chapas e bobinas</h2>
            <p class="app-desc">Orçamento comercial com preços via planilha Excel.</p>
          </a>

          <a class="app-link" href="/prospeccao/">
            <h2 class="app-title">Prospecção</h2>
            <p class="app-desc">Sistema comercial de prospecção.</p>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
