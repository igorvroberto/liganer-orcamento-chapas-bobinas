<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/webp" href="/liganer_favicon.webp" />
    <link rel="apple-touch-icon" href="/liganer_favicon.webp" />
    <title>Liganer Vendas</title>
    <style>
      :root {
        --bg: #f2f2f2;
        --paper: #ffffff;
        --ink: #17211d;
        --muted: #56635d;
        --brand: #c60000;
        --brand-2: #c60000;
        --line: #d8dfd9;
        --shadow: 0 16px 40px rgba(20, 37, 31, 0.11);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background: linear-gradient(180deg, rgba(198, 0, 0, 0.08), transparent 260px), var(--bg);
      }

      body.booting main {
        opacity: 0;
      }

      main {
        width: min(980px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 56px;
        transition: opacity 120ms ease;
      }

      .hero,
      .apps {
        background: var(--paper);
        border: 1px solid rgba(216, 223, 217, 0.9);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .hero {
        padding: 28px;
      }

      .hero-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 14px;
      }

      .hero-brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .hero-brand img {
        width: 56px;
        height: 56px;
        border-radius: 10px;
        object-fit: contain;
        background: #fff;
        flex: none;
      }

      .brand-name {
        margin: 0;
        color: var(--brand);
        font-size: clamp(1.55rem, 3.5vw, 2.1rem);
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      .session {
        text-align: right;
      }

      .session strong {
        display: block;
        font-size: 0.95rem;
      }

      .session span {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        margin: 2px 0 8px;
      }

      .session button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 0.85rem;
        font-weight: 700;
        padding: 6px 10px;
        cursor: pointer;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.35rem, 3vw, 1.75rem);
        line-height: 1.15;
        color: var(--ink);
        font-weight: 700;
      }

      .apps {
        margin-top: 20px;
        padding: 20px;
      }

      .apps + .apps {
        margin-top: 16px;
      }

      .section-title {
        margin: 0 0 14px;
        color: var(--ink);
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      .apps-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .app-link {
        display: block;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(180deg, #fff, #fbfbf7);
        color: inherit;
        text-decoration: none;
        transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      }

      .app-link:hover,
      .app-link:focus-visible {
        transform: translateY(-2px);
        border-color: rgba(198, 0, 0, 0.35);
        box-shadow: 0 14px 28px rgba(20, 37, 31, 0.08);
        outline: none;
      }

      .app-title {
        margin: 0;
        color: var(--brand);
        font-size: 1.1rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body class="booting">
    <main>
      <section class="hero">
        <div class="hero-top">
          <div class="hero-brand">
            <img src="/liganer_favicon.webp" alt="Liganer" width="56" height="56" />
            <div>
              <p class="brand-name">Liganer</p>
            </div>
          </div>
          <div class="session" id="session" hidden>
            <strong id="user-name"></strong>
            <span id="user-email"></span>
            <button type="button" id="logout">Sair</button>
          </div>
        </div>
        <h1>Sistema de vendas</h1>
      </section>

      <section class="apps" aria-labelledby="orcamento-title">
        <h2 class="section-title" id="orcamento-title">Orçamento</h2>
        <div class="apps-grid">
          <a class="app-link" href="/orcamento/chapas-bobinas/">
            <h3 class="app-title">Chapas e bobinas</h3>
          </a>

          <a class="app-link" href="/orcamento/blanks-slitters/">
            <h3 class="app-title">Blanks e slitters</h3>
          </a>

          <a class="app-link" href="/orcamento/ace/">
            <h3 class="app-title">ACE</h3>
          </a>
        </div>
      </section>

      <section class="apps" aria-labelledby="ferramentas-title">
        <h2 class="section-title" id="ferramentas-title">Ferramentas</h2>
        <div class="apps-grid">
          <a class="app-link" href="/comparador-preco/">
            <h3 class="app-title">Comparador de preço</h3>
          </a>

          <a class="app-link" href="/prospeccao/">
            <h3 class="app-title">Prospecção</h3>
          </a>
        </div>
      </section>
    </main>
    <script>
      async function requireSession() {
        try {
          const res = await fetch('/auth/me.php', { credentials: 'same-origin', cache: 'no-store' })
          if (!res.ok) {
            location.replace('/login.html?next=' + encodeURIComponent('/'))
            return
          }
          const data = await res.json()
          document.getElementById('user-name').textContent = data.user.name
          document.getElementById('user-email').textContent = data.user.email
          document.getElementById('session').hidden = false
          document.body.classList.remove('booting')
        } catch (_) {
          location.replace('/login.html?next=' + encodeURIComponent('/'))
        }
      }

      document.getElementById('logout').addEventListener('click', async () => {
        try {
          await fetch('/auth/logout.php', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' },
          })
        } catch (_) {}
        location.replace('/login.html')
      })

      requireSession()
    </script>
  </body>
</html>
